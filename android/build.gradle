buildscript {
  ext.safeExtGet = { prop, fallback -> rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'io.pulsetracker.reactnative'
  compileSdk safeExtGet('compileSdkVersion', 35)
  defaultConfig { minSdk safeExtGet('minSdkVersion', 23) }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.github.TKr0n0s:pulsetracker-android:0.3.0'
}
